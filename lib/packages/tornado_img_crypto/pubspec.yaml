name: tornado_img_crypto
description: A powerful encryption package for images with AES-CTR cipher
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.2

dependencies:
  ffi: ^2.1.0
  path: ^1.8.3
  crypto: ^3.0.6
  pointycastle: ^4.0.0
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true