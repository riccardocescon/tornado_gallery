name: tornado_img_app
description: "Tornado Image - A powerful Flutter app for image encryption"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Local packages
  tornado_img_crypto:
    path: ../../packages/tornado_img_crypto

  logger:
    path: ../../packages/logger

  # UI and navigation
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^15.1.3
  provider: ^6.1.5
  skeletonizer: ^2.1.3

  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.2
  freezed: ^3.2.3
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0

  # File and media
  photo_manager: ^3.2.1
  file_picker: ^10.1.9
  saver_gallery: ^4.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  package_info_plus: ^8.3.0
  get_it: ^9.2.0
  rxdart: ^0.28.0
  image: ^4.7.2
  wechat_assets_picker: ^10.1.0
  focused_menu: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
